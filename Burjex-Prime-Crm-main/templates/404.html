{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  {% if crm_active_favicon_url %}
  <link rel="icon" href="{{ crm_active_favicon_url }}" sizes="any">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page-bg: #f6f8fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --border: #dbe6ef;
      --text: #0b1220;
      --muted: #64748b;
      --primary: #0b3c5d;
      --primary-2: #0f5278;
      --icon-bg: #e6f4fb;
      --shadow: 0 22px 70px rgba(15, 23, 42, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #0f172a;
        --panel: #111c2e;
        --panel-2: #162238;
        --border: rgba(148, 163, 184, 0.22);
        --text: #f8fafc;
        --muted: #9fb3ca;
        --primary: #38bdf8;
        --primary-2: #7dd3fc;
        --icon-bg: rgba(56, 189, 248, 0.14);
        --shadow: 0 24px 80px rgba(2, 6, 23, 0.38);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(11, 60, 93, 0.06), transparent 38%),
        var(--page-bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .not-found {
      width: min(100%, 560px);
      text-align: center;
    }

    .not-found-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: clamp(28px, 6vw, 48px);
    }

    .not-found-icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: var(--icon-bg);
      color: var(--primary);
      border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
    }

    .not-found-icon svg {
      width: 38px;
      height: 38px;
      display: block;
    }

    .not-found-code {
      margin: 0 0 8px;
      font-size: clamp(56px, 12vw, 88px);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--text);
    }

    .not-found-title {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.2;
      font-weight: 800;
      color: var(--text);
    }

    .not-found-text {
      max-width: 420px;
      margin: 14px auto 26px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .not-found-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .not-found-btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 11px;
      padding: 0 18px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .not-found-btn:hover {
      transform: translateY(-1px);
    }

    .not-found-btn-primary {
      background: #0b3c5d;
      border-color: #0f5278;
      color: #ffffff;
    }

    .not-found-btn-primary:hover {
      background: #0f5278;
    }

    .not-found-btn-secondary {
      background: var(--panel-2);
      border-color: var(--border);
      color: var(--text);
    }

    .not-found-brand {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .not-found-card {
        border-radius: 14px;
      }

      .not-found-actions {
        flex-direction: column;
      }

      .not-found-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="not-found" aria-labelledby="not-found-title">
    <section class="not-found-card">
      <div class="not-found-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 9v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <path d="M12 17h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          <path d="M10.3 4.3 2.9 17.6A2 2 0 0 0 4.7 20h14.6a2 2 0 0 0 1.8-2.9L13.7 4.3a2 2 0 0 0-3.4 0Z"
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="not-found-code">404</p>
      <h1 class="not-found-title" id="not-found-title">Page not found</h1>
      <p class="not-found-text">This page is currently not available. It may have been moved, removed, or the link may be incorrect.</p>
      <div class="not-found-actions">
        <a class="not-found-btn not-found-btn-primary" href="/">Go to dashboard</a>
        <a class="not-found-btn not-found-btn-secondary" href="javascript:history.back()">Go back</a>
      </div>
    </section>
    <div class="not-found-brand">{{ crm_company_name|default:"Burjex Prime" }}</div>
  </main>
</body>

</html>
