{% comment %}row: post_key, label, help, url{% endcomment %}
<div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50 flex flex-col gap-3" data-branding-slot="{{ row.post_key }}">
  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2">
    <div>
      <div class="text-sm font-semibold text-slate-800">{{ row.label }}</div>
      <p class="text-xs text-slate-500 mt-0.5">{{ row.help }}</p>
    </div>
    <label class="inline-flex items-center gap-2 text-xs text-slate-600 shrink-0 cursor-pointer">
      <input type="checkbox" name="remove_{{ row.post_key }}" value="on" class="rounded border-slate-300" />
      <span>Remove</span>
    </label>
  </div>
  <div class="flex flex-col sm:flex-row gap-3 items-start">
    <div class="shrink-0 w-full sm:w-40 h-28 rounded-lg border border-slate-200 bg-white flex items-center justify-center overflow-hidden p-2">
      {% if row.url %}
        <img src="{{ row.url }}" alt="" class="max-w-full max-h-full object-contain" id="preview-{{ row.post_key }}" />
      {% else %}
        <img src="" alt="" class="max-w-full max-h-full object-contain hidden" id="preview-{{ row.post_key }}" />
        <span class="text-[10px] text-slate-400 text-center px-1 no-preview-label">No file</span>
      {% endif %}
    </div>
    <div class="flex-1 min-w-0 w-full">
      <label class="block text-xs font-medium text-slate-600">Upload / replace</label>
      <input
        type="file"
        name="{{ row.post_key }}"
        data-branding-input
        data-preview-id="preview-{{ row.post_key }}"
        accept=".png,.jpg,.jpeg,.svg,.webp,image/png,image/jpeg,image/svg+xml,image/webp"
        class="mt-1 block w-full text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-indigo-600 file:text-white"
      />
    </div>
  </div>
</div>
