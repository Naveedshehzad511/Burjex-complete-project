{% extends "admin_panel/base.html" %}
{% block title %}Permission Management{% endblock %}
{% block admin_content %}
<div class="bg-white border rounded-xl p-4 shadow-sm">
  <h1 class="text-xl font-semibold mb-3">Permission Management</h1>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    <div>
      <label class="block text-xs text-slate-600 mb-1">Select Sub Admin</label>
      <select name="user_id" class="border rounded px-3 py-2 w-full max-w-md" required>
        <option value="">Select user</option>
        {% for u in users %}<option value="{{ u.id }}">{{ u.email }} ({{ u.role }})</option>{% endfor %}
      </select>
    </div>
    <div>
      <div class="text-xs text-slate-600 mb-1">Assign Roles</div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-2 text-sm border rounded p-2">
        {% for g in groups %}
          <label class="inline-flex items-center gap-2"><input type="checkbox" name="group_ids" value="{{ g.id }}"> {{ g.name }}</label>
        {% endfor %}
      </div>
    </div>
    <div>
      <div class="text-xs text-slate-600 mb-1">Direct Permissions (optional)</div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-sm border rounded p-2 max-h-64 overflow-auto">
        {% for p in perms %}
          <label class="inline-flex items-center gap-2"><input type="checkbox" name="direct_perm_ids" value="{{ p.id }}"> {{ p.content_type.app_label }}.{{ p.codename }}</label>
        {% endfor %}
      </div>
    </div>
    <button class="bg-indigo-600 text-white rounded px-4 py-2">Save Access</button>
  </form>
</div>
{% endblock %}
