{# Expects: wl_subnav, wl_nav_active #}
<nav class="flex flex-wrap gap-2 border-b border-slate-200 pb-3 mb-6" aria-label="White label sections">
  {% for item in wl_subnav %}
    <a
      href="{{ item.url }}"
      class="px-3 py-2 rounded-lg text-sm font-semibold {% if wl_nav_active == item.key %}bg-indigo-600 text-white{% else %}bg-slate-100 text-slate-700 hover:bg-slate-200{% endif %}"
    >{{ item.label }}</a>
  {% endfor %}
</nav>
