{% extends "admin_panel/base.html" %}
{% block title %}SEO Metadata{% endblock %}
{% block admin_content %}
<div class="max-w-3xl space-y-5">
  <div>
    <h1 class="text-2xl font-semibold text-slate-900">SEO Metadata</h1>
    <p class="text-sm text-slate-600 mt-1">Basic SEO defaults for public-facing pages.</p>
  </div>
  <form method="post" class="space-y-4 bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
    {% csrf_token %}
    <label class="block text-sm"><span class="text-slate-700">Page title suffix</span>{{ form.page_title_suffix }}</label>
    <label class="block text-sm"><span class="text-slate-700">Default meta description</span>{{ form.default_meta_description }}</label>
    <label class="inline-flex items-center gap-2 text-sm text-slate-700">{{ form.robots_index }} <span>Allow indexing (robots)</span></label>
    <button type="submit" class="inline-flex px-5 py-2.5 rounded-lg bg-[#0B3C5D] text-white text-sm font-semibold">Save SEO metadata</button>
  </form>
</div>
{% endblock %}
