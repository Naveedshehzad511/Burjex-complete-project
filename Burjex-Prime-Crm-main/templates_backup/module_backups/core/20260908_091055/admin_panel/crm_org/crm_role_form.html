{% extends "sales_layout.html" %}
{% block title %}Create Role{% endblock %}
{% block admin_shell_page_title %}Create Role{% endblock %}
{% block admin_content %}
<div class="max-w-xl mx-auto px-2 pb-12">
  <h1 class="text-xl font-semibold text-slate-900 mb-4">{% block page_title %}Create Role{% endblock %}</h1>
  <form method="post" class="mt-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-4">
    {% csrf_token %}
    <div><label class="block text-sm font-medium mb-1">Role Name</label><input name="name" class="w-full rounded-lg border border-slate-200 px-3 py-2" required /></div>
    <div><label class="block text-sm font-medium mb-1">Slug</label><input name="slug" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-sm" required /></div>
    <div><label class="block text-sm font-medium mb-1">Description</label><textarea name="description" rows="3" class="w-full rounded-lg border border-slate-200 px-3 py-2"></textarea></div>
    <button class="w-full rounded-lg bg-indigo-600 text-white py-2.5 font-semibold">Create Role</button>
  </form>
</div>
{% endblock %}
