{% extends "sales_layout.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block admin_shell_page_title %}{{ page_title }}{% endblock %}
{% block admin_content %}
<div class="max-w-xl mx-auto px-2 pb-12">
  <h1 class="text-xl font-semibold text-slate-900 mb-4">{{ page_title }}</h1>
  <form method="post" class="mt-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium mb-1">Department Name</label>
      <input name="name" value="{{ department.name|default:'' }}" class="w-full rounded-lg border border-slate-200 px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Slug</label>
      <input name="slug" value="{{ department.slug|default:'' }}" class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-sm" required />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Description</label>
      <textarea name="description" class="w-full rounded-lg border border-slate-200 px-3 py-2" rows="3">{{ department.description|default:'' }}</textarea>
    </div>
    <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" name="is_active" {% if not department or department.is_active %}checked{% endif %} /> Active</label>
    <button class="w-full rounded-lg bg-indigo-600 text-white py-2.5 font-semibold">Save Department</button>
  </form>
</div>
{% endblock %}
