{% extends "admin_panel/base.html" %}
{% block title %}Demo Settings{% endblock %}
{% block admin_content %}
<div class="max-w-5xl mx-auto space-y-5">
  <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">
    <h1 class="text-xl font-semibold">Demo Settings</h1>
    <p class="text-sm text-slate-600 mt-1">Control demo groups, leverage, default balance, and optional auto-create on signup.</p>
  </div>

  <form method="post" class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
    {% csrf_token %}
    <label class="md:col-span-2 inline-flex items-center gap-2">
      <input type="checkbox" name="auto_create_on_signup" {% if obj.auto_create_on_signup %}checked{% endif %}>
      Auto-create default demo account on signup
    </label>

    <div>
      <label class="block mb-1 font-medium">Default Demo Balance</label>
      <input type="number" step="0.01" name="default_balance" value="{{ obj.default_balance }}" class="w-full border rounded-lg px-3 py-2">
    </div>
    <div>
      <label class="block mb-1 font-medium">Default Demo Leverage</label>
      <input type="number" name="default_leverage" value="{{ obj.default_leverage }}" class="w-full border rounded-lg px-3 py-2">
    </div>

    <div>
      <label class="block mb-1 font-medium">Default Demo Account Type</label>
      <select name="default_account_type" class="w-full border rounded-lg px-3 py-2">
        <option value="">Select account type</option>
        {% for t in account_types %}
          <option value="{{ t.id }}" {% if obj.default_account_type_id == t.id %}selected{% endif %}>{{ t.account_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block mb-1 font-medium">Default Demo Group</label>
      <select name="default_group" class="w-full border rounded-lg px-3 py-2">
        <option value="">Select group</option>
        {% for g in groups %}
          <option value="{{ g.id }}" {% if obj.default_group_id == g.id %}selected{% endif %}>{{ g.crm_group_name|default:g.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="md:col-span-2">
      <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-semibold">Save Demo Settings</button>
    </div>
  </form>
</div>
{% endblock %}
