{% extends "admin_panel/base.html" %}
{% block title %}reCAPTCHA{% endblock %}
{% block admin_content %}
<div class="max-w-xl mx-auto space-y-6 pb-10 px-2">
  <a href="{% url 'admin-integrations-hub' %}" class="text-sm text-indigo-600 hover:underline">← Integrations</a>
  <h1 class="text-xl font-semibold text-slate-900">Google reCAPTCHA</h1>
  <form method="post" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm space-y-5">
    {% csrf_token %}
    <div>
      <h2 class="text-xs font-bold uppercase tracking-wide text-slate-500 mb-3">Credentials</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-600 mb-1">Site key</label>
          <input type="text" name="site_key" value="{{ obj.site_key }}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" autocomplete="off" />
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">Secret key</label>
          <input type="password" name="secret_key" value="" placeholder="{% if obj.secret_key %}•••• (leave blank to keep){% endif %}" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" autocomplete="off" />
        </div>
      </div>
    </div>
    <button type="submit" class="rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-medium">Save configuration</button>
  </form>
</div>
{% endblock %}
