{% extends "admin_panel/base.html" %}
{% block title %}Profile{% endblock %}
{% block admin_content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-slate-900 mb-4">Admin Profile</h1>
    <div class="space-y-2 text-sm text-slate-700">
      <div><span class="text-slate-500">Name:</span> {{ request.user.get_full_name|default:request.user.username }}</div>
      <div><span class="text-slate-500">Email:</span> {{ request.user.email|default:"-" }}</div>
      <div><span class="text-slate-500">Role:</span> {{ request.user.role|default:"ADMIN" }}</div>
    </div>
  </div>
</div>
{% endblock %}
