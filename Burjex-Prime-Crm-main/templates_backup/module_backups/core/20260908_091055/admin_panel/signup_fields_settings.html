{% extends "admin_panel/base.html" %}

{% block title %}Signup Fields Settings{% endblock %}

{% block admin_content %}
  <div class="max-w-4xl bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
    <h1 class="text-xl font-semibold mb-5">Settings -> Signup Fields</h1>
    <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
      {% csrf_token %}
      <div>
        <label class="block mb-1 font-medium">First Name</label>
        <select name="first_name_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.first_name_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Last Name</label>
        <select name="last_name_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.last_name_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Full Name</label>
        <select name="full_name_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.full_name_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <select name="email_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.email_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Phone</label>
        <select name="phone_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.phone_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Password</label>
        <select name="password_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.password_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Country</label>
        <select name="country_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.country_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block mb-1 font-medium">Address</label>
        <select name="address_mode" class="w-full border rounded px-3 py-2">
          {% for value, label in modes %}<option value="{{ value }}" {% if s.address_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </div>
      <label class="md:col-span-2"><input type="checkbox" name="captcha_enabled" {% if s.captcha_enabled %}checked{% endif %}> Enable Google reCAPTCHA field</label>
      <div class="md:col-span-2">
        <button class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Save Settings</button>
      </div>
    </form>
  </div>
{% endblock %}
