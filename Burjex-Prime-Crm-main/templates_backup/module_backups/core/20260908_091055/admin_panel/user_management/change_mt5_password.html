{% extends "admin_panel/user_management/um_layout.html" %}
{% block um_title %}Change MT5 Password{% endblock %}
{% block um_body %}
<div class="max-w-2xl">
  <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 overflow-hidden">
    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
        <i class="fa-solid fa-key"></i>
      </div>
      <div>
        <h2 class="text-sm font-bold text-slate-900 dark:text-white">Change MT5 Password</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Reset main or investor password for a specific MT5 account.</p>
      </div>
    </div>
    
    <form method="post" class="p-5 space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Select MT5 Account</label>
        <select name="mt5_account_id" class="w-full h-10 px-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" required>
          <option value="">— Select an account —</option>
          {% for acc in accounts %}
            <option value="{{ acc.id }}">{{ acc.login_id }} — {{ acc.user.email }}</option>
          {% endfor %}
        </select>
      </div>
      
      <div>
        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Password Type</label>
        <select name="password_type" class="w-full h-10 px-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" required>
          <option value="MAIN">Main Password</option>
          <option value="INVESTOR">Investor Password</option>
          <option value="BOTH" selected>Both</option>
        </select>
      </div>
      
      <div>
        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Main Password</label>
        <div class="flex gap-2">
          <input id="main_password" type="text" name="main_password" class="flex-1 h-10 px-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500" placeholder="Leave blank to generate automatically or enter new password" />
          <button type="button" class="h-10 px-4 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" onclick="genPwd('main_password')">Generate</button>
        </div>
      </div>
      
      <div>
        <label class="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1.5 uppercase tracking-wide">Investor Password</label>
        <div class="flex gap-2">
          <input id="investor_password" type="text" name="investor_password" class="flex-1 h-10 px-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500" placeholder="Leave blank to generate automatically or enter new password" />
          <button type="button" class="h-10 px-4 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" onclick="genPwd('investor_password')">Generate</button>
        </div>
      </div>
      
      <div class="flex flex-col sm:flex-row gap-3 pt-2 border-t border-slate-100 dark:border-slate-800 mt-4">
        <button type="submit" class="h-10 px-5 rounded-lg text-white text-sm font-semibold transition-colors shadow-sm btn-gradient border-0 flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> Change Password
        </button>
        <a href="javascript:history.back()" class="h-10 px-5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-sm font-semibold transition-colors flex items-center justify-center">
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
<script>
  function genPwd(id){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";
    let p = "";
    for(let i=0;i<12;i++){ p += chars[Math.floor(Math.random()*chars.length)]; }
    const el = document.getElementById(id);
    if(el){ el.value = p; }
  }
</script>
{% endblock %}
