<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access denied</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f9; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 28px 32px; max-width: 420px; box-shadow: 0 4px 24px rgba(15,23,42,.08); border: 1px solid #e2e8f0; }
    h1 { margin: 0 0 12px; font-size: 1.25rem; color: #0f172a; }
    p { margin: 0; color: #64748b; line-height: 1.5; font-size: 0.95rem; }
    a { display: inline-block; margin-top: 20px; color: #0B3C5D; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Access denied</h1>
    <p>{{ message|default:"You do not have permission to view this area." }}</p>
    <a href="{{ home_url|default:'/admin/login/' }}">Go to your dashboard</a>
    <span style="color:#cbd5e1"> · </span>
    <a href="/admin/logout/">Logout</a>
  </div>
</body>
</html>
