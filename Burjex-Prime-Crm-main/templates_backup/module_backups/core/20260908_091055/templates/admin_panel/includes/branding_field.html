{% comment %}Expects: row with name, label, help, url{% endcomment %}
<div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50 flex flex-col gap-3" data-branding-slot="{{ row.name }}">
  <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
    <div>
      <div class="text-sm font-semibold text-slate-800">{{ row.label }}</div>
      <p class="text-xs text-slate-500 mt-0.5">{{ row.help }}</p>
    </div>
    <label class="inline-flex items-center gap-2 text-xs text-slate-600 shrink-0 cursor-pointer">
      <input type="checkbox" name="remove_{{ row.name }}" value="on" class="rounded border-slate-300" />
      <span>Remove</span>
    </label>
  </div>
  <div class="flex flex-col sm:flex-row gap-3 items-start">
    <div class="shrink-0 w-full sm:w-36 h-24 rounded-lg border border-slate-200 bg-white flex items-center justify-center overflow-hidden p-2">
      {% if row.url %}
        <img src="{{ row.url }}" alt="" class="max-w-full max-h-full object-contain" id="preview-{{ row.name }}" />
      {% else %}
        <img src="" alt="" class="max-w-full max-h-full object-contain hidden" id="preview-{{ row.name }}" />
        <span class="text-[10px] text-slate-400 text-center px-1 no-preview-label">No file</span>
      {% endif %}
    </div>
    <div class="flex-1 min-w-0 w-full space-y-2">
      <label class="block">
        <span class="text-xs font-medium text-slate-600">Replace / upload</span>
        <input
          type="file"
          name="{{ row.name }}"
          data-branding-input
          data-preview-id="preview-{{ row.name }}"
          accept=".png,.jpg,.jpeg,.svg,image/png,image/jpeg,image/svg+xml"
          class="mt-1 block w-full text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-indigo-600 file:text-white"
        />
      </label>
    </div>
  </div>
</div>
