{% extends "admin_panel/base.html" %}
{% block title %}Change Password{% endblock %}
{% block admin_content %}
<div class="max-w-3xl mx-auto">
  <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
    <h1 class="text-xl font-semibold text-slate-900 mb-4">Change Password</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<p class="text-xs text-rose-600 mt-1">{{ field.errors|striptags }}</p>{% endif %}
        </div>
      {% endfor %}
      <button class="rounded-lg bg-indigo-600 px-5 py-2.5 text-white text-sm font-semibold hover:bg-indigo-700">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
