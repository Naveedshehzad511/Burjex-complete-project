{% extends "admin_panel/base.html" %}
{% block title %}Edit risk profile{% endblock %}
{% block admin_content %}
<div class="bg-[#0B3C5D] text-white rounded-xl px-4 py-3 mb-4 shadow-sm"><h1 class="text-xl font-semibold">Risk profile — {{ profile.user.email }}</h1></div>
<div class="bg-white border rounded-xl p-6 shadow-sm max-w-lg">
  <form method="post" class="space-y-4 text-sm">{% csrf_token %}
    <div><label class="block text-slate-600 text-xs mb-1">Risk score (0–100)</label>
      <input type="number" name="risk_score" min="0" max="100" value="{{ profile.risk_score }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-slate-600 text-xs mb-1">Exposure limit (USD)</label>
      <input name="exposure_limit_usd" value="{{ profile.exposure_limit_usd }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-slate-600 text-xs mb-1">Exposure current (USD)</label>
      <input name="exposure_current_usd" value="{{ profile.exposure_current_usd }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-slate-600 text-xs mb-1">Booking</label>
      <select name="booking" class="w-full border rounded px-3 py-2">
        {% for val,label in booking_choices %}
        <option value="{{ val }}" {% if profile.booking == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select></div>
    <div><label class="block text-slate-600 text-xs mb-1">Monitoring notes</label>
      <textarea name="monitoring_notes" rows="4" class="w-full border rounded px-3 py-2">{{ profile.monitoring_notes }}</textarea></div>
    <div class="flex gap-2">
      <button class="bg-[#0B3C5D] text-white rounded px-4 py-2">Save</button>
      <a href="{% url 'admin-enterprise-risk' %}" class="border rounded px-4 py-2 text-slate-700">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
