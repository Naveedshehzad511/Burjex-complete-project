{% extends "admin_panel/base.html" %}
{% block title %}Application Features{% endblock %}
{% block admin_content %}
<div class="max-w-5xl space-y-6">
  <div>
    <h1 class="text-2xl font-semibold text-slate-900">Application Features</h1>
    <p class="text-sm text-slate-600 mt-1">Manage functional settings for client and admin experience.</p>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    {% for card in cards %}
      <a href="{% url card.url_name %}" class="block rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md hover:border-[#0B3C5D]/30 transition">
        <h3 class="font-semibold text-slate-900">{{ card.title }}</h3>
        <p class="text-xs text-slate-500 mt-1">Open setting</p>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
