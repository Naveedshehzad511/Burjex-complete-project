{% extends "user_portal/base.html" %}

{% block title %}Change Password - Burjex Prime{% endblock %}

{% block user_content %}
  <h1 class="portal-page-heading">Change Password</h1>

  <div class="portal-card max-w-md">
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="portal-form-label">Current Password</label>
        <input type="password" name="current_password" class="portal-input" required />
      </div>
      <div>
        <label class="portal-form-label">New Password</label>
        <input type="password" name="new_password" class="portal-input" required />
      </div>
      <div>
        <label class="portal-form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="portal-input" required />
      </div>
      <button type="submit" class="portal-btn-primary">Update Password</button>
    </form>
  </div>
{% endblock %}
