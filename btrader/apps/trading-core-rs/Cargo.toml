[package]
name = "btrader-matching"
version = "1.0.0"
edition = "2021"
description = "Burjex matching engine: Redis tick feed + market/pending/SL/TP execution"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dashmap = "6"
futures-util = "0.3"
hostname = "0.4"

[profile.release]
lto = true
codegen-units = 1
