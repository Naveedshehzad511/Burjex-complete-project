name: btrader_admin
description: B-Trader admin dashboard (Flutter web).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  btrader_core:
    path: ../../packages/btrader_core
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Launcher icon + web favicon/PWA (Example). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0E4D35"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/icon.png"
    background_color: "#0E4D35"
    theme_color: "#0E4D35"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
