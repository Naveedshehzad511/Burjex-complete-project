name: burjex_portal
description: Burjex Prime client portal APK — Home / Quotes / Chart / Trade / History.
publish_to: none
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  file_picker: ^8.1.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#070B14"
  adaptive_icon_foreground: assets/branding/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
