name: btrader_trader
description: B-Trader mobile trading app (iOS + Android).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  btrader_core:
    path: ../../packages/btrader_core
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Launcher icon (Example). Regenerate after editing the source PNGs with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0E4D35"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/branding/
