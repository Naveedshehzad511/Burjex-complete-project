# Serves the Flutter web admin build(s) with SPA fallback so deep links work.
# One nginx, multiple tenant admin sites picked by Host header. Caddy terminates
# TLS and proxies each admin.* hostname here; nginx routes to the right bundle.

# ── Broker admin (admin.example.com) ────────────────────────────────────
server {
  listen 80;
  server_name admin.example.com;
  root /usr/share/nginx/html-broker;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

# ── Broker web trader (app.example.com) ─────────────────────────────────────────
server {
  listen 80;
  server_name app.example.com;
  root /usr/share/nginx/html-broker-trader;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

# ── Default / Example admin (admin.example.com) ──────────────────────
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long cache for hashed assets; no-cache for the entry document.
  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
