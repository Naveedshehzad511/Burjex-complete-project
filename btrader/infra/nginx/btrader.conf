# Tenant-aware edge routing.
# - REST API on api.* and /v1 → gateway-api
# - WebSocket on /ws → ws-gateway (upgrade headers preserved)
# The Host header is passed through so the gateway's TenantMiddleware can resolve
# the tenant from the custom domain / subdomain.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream btrader_api { server gateway-api:4100; }
upstream btrader_ws  { server ws-gateway:4101; }

server {
  listen 80;
  server_name ~^(api\.)?(?<tenant>.+)$;

  # forward original host for tenant resolution
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;

  location /v1/ {
    proxy_pass http://btrader_api;
    proxy_read_timeout 60s;
  }

  location /docs {
    proxy_pass http://btrader_api;
  }

  location /ws {
    proxy_pass http://btrader_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
