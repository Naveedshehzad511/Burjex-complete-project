# ============================================================================
#  B-Trader nginx server blocks — ADD THESE to the CRM's nginx (the single
#  nginx that already owns :80/:443). Mount this file into the nginx container
#  and obtain certs for the two new subdomains (see infra/DEPLOY-HETZNER.md).
#
#  Replace btrader.example.com with your real domain. Suggested subdomains:
#    api.btrader.example.com  → REST API + Swagger  (btrader-gateway:4100)
#    ws.btrader.example.com   → WebSocket feed       (btrader-ws:4101)
#    admin.btrader.example.com→ Flutter web admin    (static files)
# ============================================================================

map $http_upgrade $bt_conn_upgrade { default upgrade; '' close; }

upstream btrader_api { server btrader-gateway:4100; keepalive 32; }
upstream btrader_ws  { server btrader-ws:4101;     keepalive 16; }

# ── HTTP → HTTPS + ACME challenge (new subdomains) ──────────────────────────
server {
  listen 80;
  server_name api.btrader.example.com ws.btrader.example.com admin.btrader.example.com;
  location /.well-known/demo-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

# ── REST API ────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name api.btrader.example.com;

  ssl_certificate     /etc/letsencrypt/live/api.btrader.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.btrader.example.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 10m;

  location / {
    proxy_pass http://btrader_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}

# ── WebSocket feed ──────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name ws.btrader.example.com;

  ssl_certificate     /etc/letsencrypt/live/ws.btrader.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ws.btrader.example.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://btrader_ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $bt_conn_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;   # keep long-lived sockets open
    proxy_send_timeout 3600s;
  }
}

# ── Flutter web admin (static) ──────────────────────────────────────────────
# Build with: flutter build web --dart-define=API_BASE=https://api.btrader.example.com \
#                                --dart-define=WS_URL=wss://ws.btrader.example.com
# Copy build/web to /var/www/btrader-admin on the host and mount it into nginx.
server {
  listen 443 ssl;
  http2 on;
  server_name admin.btrader.example.com;

  ssl_certificate     /etc/letsencrypt/live/admin.btrader.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.btrader.example.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/btrader-admin;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }   # SPA fallback
}
