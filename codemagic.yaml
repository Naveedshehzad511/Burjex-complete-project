# Codemagic CI: builds the Burjex Prime iOS app (IPA) on a Mac and sends it to TestFlight.
# Nothing here has been run yet - it needs the one-time setup below, then the first build will show any mistakes.
#
# One-time setup (needs the client's Apple Developer account):
#   1. App Store Connect > Apps > "+" > New App. Bundle ID = net.burjexprime.burjexPortal (permanent once used).
#      Copy the app's numeric "Apple ID" (App Information) into APP_STORE_APPLE_ID below.
#   2. App Store Connect > Users and Access > Integrations > App Store Connect API > generate a key
#      (role: App Manager or Admin). Download the .p8 once; note the Key ID and Issuer ID.
#   3. Codemagic (codemagic.io) > Teams > Integrations > App Store Connect > add that key and name it
#      exactly as `integrations.app_store_connect` below. Codemagic then creates the distribution
#      certificate and provisioning profile itself (ios_signing).
#   4. Codemagic > Add application > pick this repository > "codemagic.yaml" workflow > Start build.
#
# Nothing secret is in this file or in config/burjexprime.json (only public addresses).

workflows:
  ios-testflight:
    name: Burjex Prime - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Burjex-ASC
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: net.burjexprime.burjexPortal
      vars:
        APP_DIR: btrader/flutter/apps/portal
        APP_STORE_APPLE_ID: "0000000000" # TODO: numeric Apple ID of the app in App Store Connect
    scripts:
      - name: Get Flutter packages
        script: |
          cd "$APP_DIR"
          flutter packages pub get
      - name: Set up code signing on the Xcode project
        script: |
          cd "$APP_DIR"
          xcode-project use-profiles
      - name: Build the IPA (production backend)
        script: |
          cd "$APP_DIR"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=config/burjexprime.json
    artifacts:
      - btrader/flutter/apps/portal/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
