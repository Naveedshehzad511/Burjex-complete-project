# Scale hints for concurrent traders (engine stays 1x — Redis instance lock).
#
# Do NOT point Caddy at short names `btrader-gateway` / `btrader-ws`.
# bxnet_caddy is on live burjex_edge; those names resolve to duafx and
# Quotes/Chart then 401. Keep Caddy on unique `bxnet_bt_gateway` / `bxnet_bt_ws`.
# Scaling those services means dropping container_name and adding those unique
# names as network aliases on `edge` — never the Compose service name.
#
#   docker compose -p burjex_net -f docker-compose.github.yml -f docker-compose.github.scale.yml --env-file .env.github up -d --scale btrader-gateway=4 --scale btrader-ws=6
#   docker compose -p burjex_net -f docker-compose.github.yml --env-file .env.github up -d --force-recreate --no-deps caddy
#
# Prove with: k6 run btrader/loadtest/concurrent_orders.js

services:
  btrader-postgres:
    command: postgres -c max_connections=200 -c shared_buffers=512MB
  btrader-redis:
    command: >
      redis-server --requirepass ${BT_REDIS_PASSWORD} --appendonly yes
      --maxmemory 1024mb --maxmemory-policy noeviction
