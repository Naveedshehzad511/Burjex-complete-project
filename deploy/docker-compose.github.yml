# Isolated GitHub stack for burjexprime.net
# Side-by-side with live duafx.com (project "burjex"). Do NOT reuse live
# container names, volume names, network names, image tags, or 4xxx/80/443 ports.
#
#   docker compose -p burjex_net -f deploy/docker-compose.github.yml --env-file deploy/.env.github up -d --build
#
# Host ports: 6800 CRM | 6100 REST | 6101 WS | 6200 admin | 6300 ingest | 6500 portal

name: burjex_net

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    container_name: bxnet_caddy
    <<: *restart
    ports:
      - '6800:6800'
      - '6100:6100'
      - '6101:6101'
      - '6200:6200'
      - '6300:6300'
      - '6500:6500'
    env_file: .env.github
    volumes:
      - ./Caddyfile.github:/etc/caddy/Caddyfile:ro
      - bxnet_caddy_data:/data
      - bxnet_caddy_config:/config
      - bxnet_crm_static:/srv/crm/static:ro
      - bxnet_crm_media:/srv/crm/media:ro
      - ${BURJEX_WEB_ADMIN}:/srv/btrader-admin:ro
      - ${BURJEX_WEB_PORTAL}:/srv/burjex-portal:ro
    depends_on: [crm-web, btrader-gateway, btrader-ws, btrader-market-data]
    networks: [edge, live_edge]

  crm-postgres:
    image: postgres:16-alpine
    command: postgres -c max_connections=120
    container_name: bxnet_crm_postgres
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - bxnet_crm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [crm_internal]

  crm-redis:
    image: redis:7-alpine
    container_name: bxnet_crm_redis
    <<: *restart
    command: >
      redis-server --requirepass ${CRM_REDIS_PASSWORD} --appendonly yes
      --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - bxnet_crm_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${CRM_REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [crm_internal]

  crm-web:
    build:
      context: ../Burjex-Prime-Crm-main
      dockerfile: ../deploy/crm/Dockerfile
    image: burjex/crm:net
    container_name: bxnet_crm_web
    <<: *restart
    env_file: .env.github
    command: >-
      sh -lc "python manage.py migrate --noinput && python manage.py collectstatic --noinput && exec gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers ${CRM_WEB_WORKERS:-1} --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -"
    volumes:
      - bxnet_crm_static:/app/staticfiles
      - bxnet_crm_media:/app/media
      - bxnet_crm_logs:/app/logs
      - bxnet_crm_backups:/app/storage/backups
    depends_on:
      crm-postgres: { condition: service_healthy }
      crm-redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8000/health/ready/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks: [crm_internal, edge]

  crm-worker:
    build:
      context: ../Burjex-Prime-Crm-main
      dockerfile: ../deploy/crm/Dockerfile
    image: burjex/crm:net
    container_name: bxnet_crm_worker
    <<: *restart
    env_file: .env.github
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-2}
    volumes:
      - bxnet_crm_media:/app/media
      - bxnet_crm_logs:/app/logs
      - bxnet_crm_backups:/app/storage/backups
    depends_on:
      crm-web: { condition: service_healthy }
    networks: [crm_internal, edge]

  crm-beat:
    build:
      context: ../Burjex-Prime-Crm-main
      dockerfile: ../deploy/crm/Dockerfile
    image: burjex/crm:net
    container_name: bxnet_crm_beat
    <<: *restart
    env_file: .env.github
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      crm-web: { condition: service_healthy }
    networks: [crm_internal, edge]

  btrader-postgres:
    image: postgres:16-alpine
    container_name: bxnet_bt_postgres
    <<: *restart
    # Sized for 160 gateway + 64 matcher + 20 market-data + 40 worker
    # connections, leaving burst/restart headroom below max_connections.
    # Validate WAL/checkpoint latency on the isolated staging disk before any
    # production rollout; these settings are not a capacity certification.
    command: >-
      postgres -c max_connections=400 -c shared_buffers=1GB
      -c wal_compression=on -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: ${BT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BT_POSTGRES_DB}
    volumes:
      - bxnet_bt_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${BT_POSTGRES_USER} -d ${BT_POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations: { cpus: '0.75', memory: 1G }
        limits: { cpus: '1.50', memory: 3G, pids: 256 }
    networks: [btrader_internal]

  btrader-redis:
    image: redis:7-alpine
    container_name: bxnet_bt_redis
    <<: *restart
    command: >
      redis-server --requirepass ${BT_REDIS_PASSWORD} --appendonly yes
      --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - bxnet_bt_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${BT_REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations: { cpus: '0.25', memory: 256M }
        limits: { cpus: '0.75', memory: 1G, pids: 128 }
    networks: [btrader_internal]

  btrader-gateway:
    build: { context: ../btrader, dockerfile: infra/Dockerfile, args: { SERVICE: gateway-api } }
    image: burjex/btrader-gateway:net
    # Unique name required: bxnet_caddy is on burjex_edge, so `btrader-gateway`
    # DNS hits live duafx and Quotes/Chart return 401. Do not use the short
    # Compose service name as the Caddy upstream.
    container_name: bxnet_bt_gateway
    <<: *restart
    expose: ['4100']
    env_file: .env.github
    environment:
      NODE_ENV: production
      API_PORT: '4100'
      # HTTP + in-process engine: 200 vs previous 80. Postgres max_connections
      # is 400 so gateway 160 + matcher 64 + market-data 20 + worker 40 fit.
      # A saturated pool should fail quickly; it must not hide a multi-second
      # trading queue behind an HTTP request.
      DATABASE_URL: postgresql://${BT_POSTGRES_USER}:${BT_POSTGRES_PASSWORD}@btrader-postgres:5432/${BT_POSTGRES_DB}?schema=public&connection_limit=160&pool_timeout=2
      # Account mutation locks reject contention immediately; they never add a
      # hidden queue delay beyond the group's configured execution budget.
      ACCOUNT_QUEUE_WAIT_MS: ${ACCOUNT_QUEUE_WAIT_MS:-0}
      REDIS_URL: redis://:${BT_REDIS_PASSWORD}@btrader-redis:6379
      RUST_ENGINE_URL: http://btrader-matching:4300
      RUST_ENGINE_TOKEN: ${RUST_ENGINE_TOKEN:-}
      CHART_PROVIDER: ${CHART_PROVIDER:-internal}
      BROKER_UTC_OFFSET_SEC: ${BROKER_UTC_OFFSET_SEC:-10800}
      ORDER_RATE_MAX: ${ORDER_RATE_MAX:-40}
      ORDER_RATE_WINDOW_MS: ${ORDER_RATE_WINDOW_MS:-1000}
      # Per-IP HTTP throttle (Nest). Code defaults stay 300/min GET, 60/min login.
      # This stack is the 500-VU Grafana Cloud target (few NAT IPs, many readers).
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-12000}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-600}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # Optional: k6 sends X-BT-Load-Test with the same value to skip throttle.
      # Leave empty so the header is ignored unless you set LOAD_TEST_KEY.
      LOAD_TEST_KEY: ${LOAD_TEST_KEY:-}
      PORTAL_READ_CACHE_MS: ${PORTAL_READ_CACHE_MS:-2000}
      # Quotes 431: large JWTs (many account ids) exceeded Node's 16KB header cap.
      NODE_OPTIONS: "--max-http-header-size=131072"
    command: >-
      sh -lc "cd /app && pnpm --filter @btrader/db exec prisma db push --skip-generate &&
      cd /app/apps/gateway-api && exec node dist/main.js"
    depends_on:
      btrader-postgres: { condition: service_healthy }
      btrader-redis: { condition: service_healthy }
      btrader-matching: { condition: service_started }
    volumes:
      - bxnet_bt_uploads:/app/uploads
    deploy:
      resources:
        reservations: { cpus: '0.50', memory: 512M }
        limits: { cpus: '1.00', memory: 1536M, pids: 512 }
    networks: [btrader_internal, edge]

  # Off-path operational telemetry only. This container has no trading, Docker,
  # SSH, or bridge control path; resource limits keep it unable to starve the
  # matching stack even if a health dependency fails noisily.
  server-monitor-agent:
    build: { context: ../btrader/apps/server-monitor-agent, dockerfile: Dockerfile }
    image: burjex/server-monitor-agent:net
    container_name: bxnet_server_monitor_agent
    <<: *restart
    env_file: .env.github
    environment:
      SERVER_MONITOR_API_URL: http://btrader-gateway:4100
      SERVER_MONITOR_SERVER_ID: forexten-registry-only
      SERVER_MONITOR_INTERVAL_MS: '30000'
      SERVER_MONITOR_APP_VERSION: ${SERVER_MONITOR_APP_VERSION:-live}
      SERVER_MONITOR_SERVICE_URLS_JSON: >-
        {"gateway":"http://btrader-gateway:4100/v1/health","engine":"http://btrader-matching:4300/health","marketData":"http://btrader-market-data:4200/health","ws":"tcp://btrader-ws:4101","postgres":"tcp://btrader-postgres:5432","redis":"tcp://btrader-redis:6379"}
    read_only: true
    depends_on:
      btrader-gateway: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: '0.05', memory: 96M, pids: 32 }
    networks: [btrader_internal]

  btrader-matching:
    build: { context: ../btrader/apps/trading-core-rs, dockerfile: Dockerfile }
    image: burjex/btrader-matching:net
    container_name: bxnet_bt_matching
    <<: *restart
    env_file: .env.github
    environment:
      DATABASE_URL: postgresql://${BT_POSTGRES_USER}:${BT_POSTGRES_PASSWORD}@btrader-postgres:5432/${BT_POSTGRES_DB}
      REDIS_URL: redis://:${BT_REDIS_PASSWORD}@btrader-redis:6379
      ENGINE_HTTP_PORT: '4300'
      ENGINE_PG_POOL: ${ENGINE_PG_POOL:-64}
      # Pending/SL/TP checks use the latest tick in a 1ms-class loop. The
      # slow loop below is only account/P&L maintenance.
      ENGINE_FAST_INTERVAL_MS: ${ENGINE_FAST_INTERVAL_MS:-1}
      ENGINE_TICK_INTERVAL_MS: ${ENGINE_TICK_INTERVAL_MS:-250}
      ACCOUNT_QUEUE_WAIT_MS: ${ACCOUNT_QUEUE_WAIT_MS:-0}
      MAX_PRICE_AGE_MS: ${MAX_PRICE_AGE_MS:-1000}
      MAX_FEED_STILL_MS: ${MAX_FEED_STILL_MS:-120000}
      RUST_ENGINE_TOKEN: ${RUST_ENGINE_TOKEN:-}
      RUST_LOG: info
    expose: ['4300']
    depends_on:
      btrader-postgres: { condition: service_healthy }
      btrader-redis: { condition: service_healthy }
    # The matcher has its own hard cgroup. It still needs host-level core
    # pinning in Phase 3; do not claim otherwise from compose quotas alone.
    deploy:
      resources:
        reservations: { cpus: '1.50', memory: 1G }
        limits: { cpus: '2.00', memory: 2G, pids: 256 }
    networks: [btrader_internal]

  btrader-ws:
    build: { context: ../btrader, dockerfile: infra/Dockerfile, args: { SERVICE: ws-gateway } }
    image: burjex/btrader-ws:net
    # Unique name — same burjex_edge collision as gateway (`btrader-ws` is duafx).
    container_name: bxnet_bt_ws
    <<: *restart
    expose: ['4101']
    env_file: .env.github
    environment:
      NODE_ENV: production
      WS_PORT: '4101'
      REDIS_URL: redis://:${BT_REDIS_PASSWORD}@btrader-redis:6379
      NODE_OPTIONS: "--max-http-header-size=131072"
      WS_TICK_FLUSH_MS: ${WS_TICK_FLUSH_MS:-1}
      WS_EVT_BATCH_MS: ${WS_EVT_BATCH_MS:-0}
      WS_MAX_BUFFERED_BYTES: ${WS_MAX_BUFFERED_BYTES:-1048576}
      WS_MAX_TICK_BUFFER: ${WS_MAX_TICK_BUFFER:-2048}
      WS_MAX_EVENT_BUFFER: ${WS_MAX_EVENT_BUFFER:-512}
    depends_on:
      btrader-redis: { condition: service_healthy }
    deploy:
      resources:
        reservations: { cpus: '0.50', memory: 512M }
        limits: { cpus: '1.00', memory: 1536M, pids: 2048 }
    networks: [btrader_internal, edge]

  btrader-engine:
    build: { context: ../btrader, dockerfile: infra/Dockerfile, args: { SERVICE: trading-engine } }
    image: burjex/btrader-engine:net
    container_name: bxnet_bt_engine
    <<: *restart
    env_file: .env.github
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${BT_POSTGRES_USER}:${BT_POSTGRES_PASSWORD}@btrader-postgres:5432/${BT_POSTGRES_DB}?schema=public&connection_limit=40&pool_timeout=30
      REDIS_URL: redis://:${BT_REDIS_PASSWORD}@btrader-redis:6379
      ENGINE_FAST_INTERVAL_MS: ${ENGINE_FAST_INTERVAL_MS:-1}
      ENGINE_TICK_INTERVAL_MS: ${ENGINE_TICK_INTERVAL_MS:-250}
      ENGINE_TICK_CONCURRENCY: ${ENGINE_TICK_CONCURRENCY:-4}
      ORDER_RATE_MAX: ${ORDER_RATE_MAX:-40}
      ORDER_RATE_WINDOW_MS: ${ORDER_RATE_WINDOW_MS:-1000}
      ACCOUNT_QUEUE_WAIT_MS: ${ACCOUNT_QUEUE_WAIT_MS:-0}
      # Host must be the hyphen service name. Django rejects bxnet_crm_web (underscore).
      CRM_WEBHOOK_URL: http://crm-web:8000/api/btrader/webhook/
    depends_on:
      btrader-postgres: { condition: service_healthy }
      btrader-redis: { condition: service_healthy }
      btrader-gateway: { condition: service_started }
    networks: [btrader_internal, edge]

  btrader-market-data:
    build: { context: ../btrader, dockerfile: infra/Dockerfile, args: { SERVICE: market-data } }
    image: burjex/btrader-market-data:net
    container_name: bxnet_bt_market_data
    <<: *restart
    env_file: .env.github
    environment:
      NODE_ENV: production
      DATABASE_URL: ${BTRADER_DATABASE_URL}
      REDIS_URL: ${BTRADER_REDIS_URL}
      LP_BRIDGE_DRIVER: ${LP_BRIDGE_DRIVER:-mock}
      MT5_INGEST_PORT: '4200'
      MT5_FEED_TOKEN: ${MT5_FEED_TOKEN:-}
      MT5_SYMBOL_SUFFIX: ${MT5_SYMBOL_SUFFIX:-}
      MT5_MAX_TICK_AGE_MS: ${MT5_MAX_TICK_AGE_MS:-0}
      CANDLE_FLUSH_SCAN_MS: ${CANDLE_FLUSH_SCAN_MS:-5000}
      CANDLE_TIP_MIN_MS: ${CANDLE_TIP_MIN_MS:-20000}
      CANDLE_BATCH_SIZE: ${CANDLE_BATCH_SIZE:-80}
      CANDLE_MAX_PER_FLUSH: ${CANDLE_MAX_PER_FLUSH:-400}
      CANDLE_FLUSH_YIELD_MS: ${CANDLE_FLUSH_YIELD_MS:-75}
      CANDLE_HISTORY_QUEUE_CAP: ${CANDLE_HISTORY_QUEUE_CAP:-40000}
      BROKER_UTC_OFFSET_SEC: ${BROKER_UTC_OFFSET_SEC:-10800}
    expose: ['4200']
    depends_on:
      btrader-postgres: { condition: service_healthy }
      btrader-redis: { condition: service_healthy }
      btrader-gateway: { condition: service_started }
    deploy:
      resources:
        reservations: { cpus: '0.50', memory: 512M }
        limits: { cpus: '1.00', memory: 1280M, pids: 256 }
    networks: [btrader_internal, edge]

volumes:
  bxnet_caddy_data:
  bxnet_caddy_config:
  bxnet_crm_pg:
  bxnet_crm_redis:
  bxnet_crm_static:
  bxnet_crm_media:
  bxnet_crm_logs:
  bxnet_crm_backups:
  bxnet_bt_pg:
  bxnet_bt_redis:
  bxnet_bt_uploads:

networks:
  edge:
    name: burjex_net_edge
    driver: bridge
  crm_internal:
    name: burjex_net_crm
    driver: bridge
  btrader_internal:
    name: burjex_net_bt
    driver: bridge
  live_edge:
    external: true
    name: burjex_edge
